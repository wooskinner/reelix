<body>

<div id="splash"><div class="splash-mark"><span>REELIX</span></div></div>
<script>
(function(){
  var MAX_SPLASH_MS = 600; // safety cap so splash never blocks longer than this
  var removed = false;
  function dismiss(){
    if (removed) return;
    removed = true;
    var splash = document.getElementById('splash');
    if (!splash) return;
    splash.classList.add('fade-out');
    setTimeout(function(){ splash.remove(); }, 250);
  }
  // Dismiss as soon as the hero content is actually painted, not on a fixed timer
  window.addEventListener('heroReady', dismiss);
  setTimeout(dismiss, MAX_SPLASH_MS);
})();
</script>
